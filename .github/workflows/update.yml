name: Daily Nintendo eShop KR Sync

on:
  schedule:
    # Runs at 18:00 UTC (3:00 AM KST) every day
    - cron: '0 18 * * *'
  workflow_dispatch: # Allows manual execution from the GitHub interface

jobs:
  sync-eshop:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run eShop Sync Script
        run: python sync_eshop.py

      - name: Commit and Push Database Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add database.sqlite
          
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update database: $(date +'%Y-%m-%d %H:%M:%S')" && git push)
